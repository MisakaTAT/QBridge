name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: strip linux binary
        if: runner.os == 'Linux'
        run: strip --strip-all target/${{ matrix.target }}/release/qbridge

      - name: upx linux binary
        if: runner.os == 'Linux'
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: target/${{ matrix.target }}/release/qbridge
          args: --best --lzma

      - name: upx windows binary
        if: runner.os == 'Windows'
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: target/${{ matrix.target }}/release/qbridge.exe
          args: --best --lzma

      - name: package linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/qbridge" "dist/${{ matrix.target }}/"
          cp qbridge.example.toml README.md API_MAPPING.md LICENSE "dist/${{ matrix.target }}/"
          tar -czf "qbridge-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" -C "dist/${{ matrix.target }}" .

      - name: package windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.target }}" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/qbridge.exe" "dist/${{ matrix.target }}/"
          Copy-Item qbridge.example.toml,README.md,API_MAPPING.md,LICENSE "dist/${{ matrix.target }}/"
          Compress-Archive -Path "dist/${{ matrix.target }}/*" -DestinationPath "qbridge-${env:GITHUB_REF_NAME}-${{ matrix.target }}.zip"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qbridge-${{ matrix.target }}
          path: |
            qbridge-*.tar.gz
            qbridge-*.zip
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
